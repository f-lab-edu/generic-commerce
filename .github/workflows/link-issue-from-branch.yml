name: Link Issue From Branch Name

on:
  pull_request:
    types: [opened]

jobs:
  link-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Extract issue number from branch name
        id: extract
        run: |
          echo "Branch name: ${{ github.head_ref }}"
          if [[ "${GITHUB_HEAD_REF}" =~ ([0-9]+) ]]; then
            echo "issue_number=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          else
            echo "No issue number found in branch name. Skipping."
            exit 0
          fi

      - name: Comment on PR with issue link
        if: env.issue_number != ''
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Related to: #${{ env.issue_number }}
