name: Link Issue From Branch Name

on:
  # 자동 실행 (PR 열릴 때)
  pull_request:
    types: [opened]

  # 수동 실행도 가능
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to link issue'
        required: true

jobs:
  link-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Set PR number
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_ENV
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi

      - name: Get PR branch name
        id: get-branch
        run: |
          echo "Fetching branch name for PR #${{ env.pr_number }}"
          branch=$(gh pr view ${{ env.pr_number }} --json headRefName -q .headRefName)
          echo "Branch name: $branch"
          echo "branch=$branch" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract issue number from branch name
        id: extract
        run: |
          echo "Extracting issue number from branch: $branch"
          if [[ "$branch" =~ ([0-9]+) ]]; then
            echo "issue_number=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "Found issue number: ${BASH_REMATCH[1]}"
          else
            echo "No issue number found in branch name. Skipping."
            exit 0
          fi

      - name: Comment on PR with issue link
        if: env.issue_number != ''
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ env.pr_number }}
          body: |
            Closes: #${{ env.issue_number }}
