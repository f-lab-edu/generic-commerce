name: Link Issue From Branch Name

on:
  # PR 열릴 때 자동 실행
  pull_request:
    types: [opened]

  # 수동 실행도 가능
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to link issue'
        required: true

jobs:
  link-issue:
    runs-on: ubuntu-latest

    steps:
      # ✅ 레포를 체크아웃해서 .git 디렉토리 확보
      - name: Checkout code
        uses: actions/checkout@v4

      # PR 번호 설정
      - name: Set PR number
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_ENV
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          fi

      # PR 브랜치명 가져오기
      - name: Get PR branch name
        id: get-branch
        run: |
          echo "Fetching branch name for PR #${{ env.pr_number }}"
          branch=$(gh pr view ${{ env.pr_number }} --json headRefName -q .headRefName)
          echo "Branch name: $branch"
          echo "branch=$branch" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 브랜치명에서 이슈 번호 추출
      - name: Extract issue number from branch name
        id: extract
        run: |
          echo "Extracting issue number from branch: $branch"
          if [[ "$branch" =~ ([0-9]+) ]]; then
            echo "issue_number=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "Found issue number: ${BASH_REMATCH[1]}"
          else
            echo "No issue number found in branch na
